[package]
name = "pasted-app"
version = "1.0.0-rc.6"
description = "Pasted - Native, Subscription-Free Clipboard Manager"
authors = ["Antigravity"]
license = "MIT"
repository = "https://github.com/getpasted/pasted"
edition = "2021"
default-run = "pasted-app"
autobins = false

[lib]
name = "pasted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pasted-app"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "pasted"
path = "src/bin/pasted.rs"
required-features = ["cli"]

[features]
default = ["gui"]
cli = ["dep:reqwest"]
gui = [
    "dep:arboard",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-window-state",
    "dep:window-vibrancy",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
arboard = { version = "3.4", features = ["wayland-data-control"], optional = true }
sha2 = "0.11"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
parking_lot = "0.12"
plist = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
infer = "0.22"
base64 = "0.23"
once_cell = "1.20"
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
window-vibrancy = { version = "0.8", optional = true }
dirs = "6.0"
unicode-normalization = "0.1"
url = "2.5"
tauri-plugin-updater = { version = "2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"], optional = true }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Accessibility"] }
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
gtk = "0.18"
x11rb = { version = "0.14", features = ["xkb"] }

[lints.rust]
unexpected_cfgs = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
