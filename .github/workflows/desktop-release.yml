name: Desktop release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Verify Rust dependency policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --all-features
          command: check
          command-arguments: advisories bans licenses sources --hide-inclusion-graph

  metadata:
    name: Verify release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run licenses:check
      - run: npm run dependencies:check
      - run: npm run sbom:check
      - id: version
        name: Read and verify version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  macos:
    name: Signed macOS universal DMG
    needs: [metadata, dependency-policy]
    runs-on: macos-latest
    environment: release-macos
    env:
      # Tauri otherwise skips Finder background and icon layout metadata on CI.
      TAURI_BUNDLER_DMG_IGNORE_CI: true
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PASTED_UPDATER_PUBLIC_KEY: ${{ secrets.PASTED_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Require Apple release credentials
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD PASTED_UPDATER_PUBLIC_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release-macos secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/pasted-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo 'Imported certificate did not provide a Developer ID Application identity.' >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize universal DMG
        run: |
          bash scripts/build-macos-universal-cli.sh
          codesign \
            --force \
            --timestamp \
            --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            src-tauri/target/universal-apple-darwin/release/pasted
          codesign \
            --verify \
            --strict \
            --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/pasted
          npm run stage:cli-sidecar:macos-universal
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Pasted_*.dmg' -type f -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo 'Tauri did not produce a universal macOS DMG.' >&2
            exit 1
          fi
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
      - name: Extract notarized macOS payload for SBOM
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Pasted_*.dmg' -type f -print -quit)"
          scan_root="$RUNNER_TEMP/pasted-artifact-scan"
          mount_path="$scan_root/mount"
          mkdir -p "$mount_path"
          device="$(hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path" | awk '/^\/dev\// { print $1; exit }')"
          ditto "$mount_path/Pasted.app" "$scan_root/Pasted.app"
          hdiutil detach "$device"
          cp src-tauri/target/universal-apple-darwin/release/pasted "$scan_root/pasted-macos-universal"
          echo "ARTIFACT_SCAN_PATH=$scan_root" >> "$GITHUB_ENV"
          echo "ARTIFACT_SBOM_PATH=$RUNNER_TEMP/Pasted-macos.artifact.spdx.json" >> "$GITHUB_ENV"
      - name: Generate exact-artifact SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.ARTIFACT_SCAN_PATH }}
          format: spdx-json
          output-file: ${{ env.ARTIFACT_SBOM_PATH }}
          artifact-name: Pasted-release-macOS-artifact.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Audit exact-artifact SBOM
        run: node scripts/audit-artifact-sbom.js "$ARTIFACT_SBOM_PATH" macos
      - name: Verify and stage macOS release
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Pasted_*.dmg' -type f -print -quit)"
          bash scripts/verify-macos-release.sh "$dmg_path"
          mkdir -p release-assets
          cp "$dmg_path" "release-assets/Pasted_${RELEASE_VERSION}_universal.dmg"
          updater_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app.tar.gz' -type f -print -quit)"
          if [[ -z "$updater_path" || ! -f "${updater_path}.sig" ]]; then
            echo 'Tauri did not produce a signed universal macOS updater.' >&2
            exit 1
          fi
          cp "$updater_path" release-assets/
          cp "${updater_path}.sig" release-assets/
          cp src-tauri/target/universal-apple-darwin/release/pasted release-assets/pasted-macos-universal
          cp THIRD_PARTY_NOTICES.txt release-assets/
          cp THIRD_PARTY_SBOM.spdx.json "release-assets/Pasted_${RELEASE_VERSION}_source.spdx.json"
          cp "$ARTIFACT_SBOM_PATH" "release-assets/Pasted_${RELEASE_VERSION}_macos.artifact.spdx.json"
          cd release-assets
          shasum -a 256 ./* > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Pasted-release-macOS
          path: release-assets/*
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    needs: [metadata, dependency-policy]
    runs-on: ubuntu-22.04
    environment: release-linux
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PASTED_UPDATER_PUBLIC_KEY: ${{ secrets.PASTED_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Require updater signing credentials
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD PASTED_UPDATER_PUBLIC_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release-linux secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Build headless CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --no-default-features --features cli --bin pasted
      - name: Stage CLI for AppImage
        run: npm run stage:cli-sidecar
      - run: npm run tauri -- build --bundles appimage --config src-tauri/tauri.release.conf.json
      - name: Extract Linux AppImage payload for SBOM
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f -print -quit)"
          scan_root="$RUNNER_TEMP/pasted-artifact-scan"
          mkdir -p "$scan_root"
          chmod +x "$appimage"
          (
            cd "$scan_root"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          cp src-tauri/target/release/pasted "$scan_root/pasted-linux-x86_64"
          echo "ARTIFACT_SCAN_PATH=$scan_root" >> "$GITHUB_ENV"
          echo "ARTIFACT_SBOM_PATH=$RUNNER_TEMP/Pasted-linux.artifact.spdx.json" >> "$GITHUB_ENV"
      - name: Generate exact-artifact SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.ARTIFACT_SCAN_PATH }}
          format: spdx-json
          output-file: ${{ env.ARTIFACT_SBOM_PATH }}
          artifact-name: Pasted-release-Linux-artifact.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Audit exact-artifact SBOM
        run: node scripts/audit-artifact-sbom.js "$ARTIFACT_SBOM_PATH" linux
      - name: Stage Linux release
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig release-assets/
          cp src-tauri/target/release/pasted release-assets/pasted-linux-x86_64
          cp THIRD_PARTY_NOTICES.txt release-assets/
          cp "$ARTIFACT_SBOM_PATH" "release-assets/Pasted_${RELEASE_VERSION}_linux.artifact.spdx.json"
          cd release-assets
          sha256sum ./* > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Pasted-release-Linux
          path: release-assets/*
          if-no-files-found: error

  windows:
    name: Windows x86_64 experimental installer
    needs: [metadata, dependency-policy]
    runs-on: windows-latest
    environment: release-windows
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PASTED_UPDATER_PUBLIC_KEY: ${{ secrets.PASTED_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Require updater signing credentials
        shell: pwsh
        run: |
          foreach ($name in @('TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD', 'PASTED_UPDATER_PUBLIC_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing release-windows secret: $name"
            }
          }
      - name: Build headless CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --no-default-features --features cli --bin pasted
      - name: Stage CLI for Windows installer
        run: npm run stage:cli-sidecar
      - name: Build unsigned Windows installer
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Extract Windows installer payload for SBOM
        shell: pwsh
        run: |
          $scanRoot = Join-Path $env:RUNNER_TEMP 'pasted-artifact-scan'
          New-Item -ItemType Directory -Force $scanRoot | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          & 7z x $installer.FullName "-o$scanRoot" -y | Out-Null
          Copy-Item src-tauri/target/release/pasted.exe "$scanRoot/pasted-windows-x86_64.exe"
          "ARTIFACT_SCAN_PATH=$scanRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_SBOM_PATH=$env:RUNNER_TEMP/Pasted-windows.artifact.spdx.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate exact-artifact SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ env.ARTIFACT_SCAN_PATH }}
          format: spdx-json
          output-file: ${{ env.ARTIFACT_SBOM_PATH }}
          artifact-name: Pasted-release-Windows-artifact.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Audit exact-artifact SBOM
        run: node scripts/audit-artifact-sbom.js "${{ env.ARTIFACT_SBOM_PATH }}" windows
      - name: Stage unsigned Windows release
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig release-assets/
          Copy-Item src-tauri/target/release/pasted.exe release-assets/pasted-windows-x86_64.exe
          Copy-Item THIRD_PARTY_NOTICES.txt release-assets/
          Copy-Item $env:ARTIFACT_SBOM_PATH "release-assets/Pasted_${env:RELEASE_VERSION}_windows.artifact.spdx.json"
          $checksumLines = Get-ChildItem release-assets -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $checksumPath = Join-Path (Resolve-Path release-assets) 'SHA256SUMS-windows-x86_64.txt'
          [IO.File]::WriteAllText($checksumPath, (($checksumLines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Pasted-release-Windows-experimental
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Assemble draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [metadata, macos, linux, windows]
    runs-on: ubuntu-22.04
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pasted-release-*
          path: release-assets
          merge-multiple: false
      - name: Generate Homebrew Cask
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dmg_path="$(find release-assets -type f -name "Pasted_${RELEASE_VERSION}_universal.dmg" -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "The universal macOS DMG was not downloaded." >&2
            exit 1
          fi
          sha256="$(sha256sum "$dmg_path" | cut -d ' ' -f 1)"
          node scripts/render-homebrew-cask.js \
            --version "$RELEASE_VERSION" \
            --sha256 "$sha256" \
            --output release-assets/pasted.rb
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-release-assets.js release-assets release-assets-flat
          mapfile -d '' assets < <(find release-assets-flat -type f -print0 | sort -z)

          version="${{ needs.metadata.outputs.version }}"
          if [[ "$version" =~ ^(.+)-rc\.([0-9]+)$ ]]; then
            release_title="Pasted ${BASH_REMATCH[1]} RC${BASH_REMATCH[2]}"
          else
            release_title="Pasted $version"
          fi

          existing_draft="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' 2>/dev/null || true
          )"
          if [[ -z "$existing_draft" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$release_title" \
              --generate-notes
          elif [[ "$existing_draft" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title"
          else
            echo "Refusing to replace a published release for $GITHUB_REF_NAME." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
