name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Detect CodeQL scope
    runs-on: ubuntu-22.04
    outputs:
      actions: ${{ steps.scope.outputs.actions }}
      javascript: ${{ steps.scope.outputs.javascript }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed language surfaces
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actions=true
          javascript=true
          rust=true

          if test "$EVENT_NAME" = "pull_request" || test "$EVENT_NAME" = "push"; then
            actions=false
            javascript=false
            rust=false

            if test "$EVENT_NAME" = "pull_request"; then
              diff_base="$BASE_SHA"
            else
              diff_base="$BEFORE_SHA"
            fi

            if test -z "$diff_base" || test "$diff_base" = "0000000000000000000000000000000000000000"; then
              actions=true
              javascript=true
              rust=true
            else
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/codeql.yml|.github/codeql/*)
                    actions=true
                    javascript=true
                    rust=true
                    ;;
                  .github/workflows/*|.github/actions/*)
                    actions=true
                    ;;
                  src-tauri/*|.cargo/*|rust-toolchain*|deny.toml)
                    rust=true
                    ;;
                  src/*|scripts/*|package.json|package-lock.json|tsconfig*.json|vite.config.*|*.js|*.cjs|*.mjs|*.ts|*.tsx)
                    javascript=true
                    ;;
                esac
              done < <(git diff --name-only "$diff_base" "$HEAD_SHA")
            fi
          fi

          echo "actions=$actions" >> "$GITHUB_OUTPUT"
          echo "javascript=$javascript" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  analyze-actions:
    name: Analyze (actions)
    if: needs.scope.outputs.actions == 'true'
    needs: [scope]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.37.8
        with:
          languages: actions
      - uses: github/codeql-action/analyze@v4.37.8
        with:
          category: /language:actions

  analyze-javascript:
    name: Analyze (javascript-typescript)
    if: needs.scope.outputs.javascript == 'true'
    needs: [scope]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.37.8
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4.37.8
        with:
          category: /language:javascript-typescript

  analyze-rust:
    name: Analyze (rust)
    if: needs.scope.outputs.rust == 'true'
    needs: [scope]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.37.8
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4.37.8
        with:
          category: /language:rust

  codeql:
    name: CodeQL
    if: always()
    needs: [scope, analyze-actions, analyze-javascript, analyze-rust]
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm scoped analyses
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          ACTIONS_REQUIRED: ${{ needs.scope.outputs.actions }}
          ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
          JAVASCRIPT_REQUIRED: ${{ needs.scope.outputs.javascript }}
          JAVASCRIPT_RESULT: ${{ needs.analyze-javascript.result }}
          RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          RUST_RESULT: ${{ needs.analyze-rust.result }}
        run: |
          test "$SCOPE_RESULT" = "success"
          for language in ACTIONS JAVASCRIPT RUST; do
            required_name="${language}_REQUIRED"
            result_name="${language}_RESULT"
            if test "${!required_name}" = "true"; then
              test "${!result_name}" = "success"
            else
              test "${!result_name}" = "skipped"
            fi
          done
