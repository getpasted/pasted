name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npm run test:platform
      - run: npm run build
      - name: Build portable x86_64 AppImage
        run: npm run tauri build -- --bundles appimage
      - name: Record checksum
        run: |
          cd src-tauri/target/release/bundle/appimage
          cp ../../pasted-cli ./pasted-cli-linux-x86_64
          sha256sum ./*.AppImage ./pasted-cli-linux-x86_64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Pasted-linux-x86_64-AppImage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/pasted-cli-linux-x86_64
            src-tauri/target/release/bundle/appimage/SHA256SUMS
          if-no-files-found: error
