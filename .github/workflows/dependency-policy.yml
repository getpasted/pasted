name: Dependency policy

on:
  schedule:
    # Runs after the Monday Dependabot windows configured in dependabot.yml.
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Verify dependency policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm run dependencies:check
      - run: npm run sbom:check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --all-features
          command: check
          command-arguments: advisories bans licenses sources --hide-inclusion-graph
