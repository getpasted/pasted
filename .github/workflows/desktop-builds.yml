name: Desktop builds

on:
  # Drafts run only the inexpensive dependency gates below. Moving a pull
  # request to ready triggers the complete required validation matrix.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Preserve function names in CI failures without paying for full line-table
# debug data in every dev/test artifact. Release packaging is unaffected.
env:
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0, CC0-1.0, ISC, MIT, MIT-0, MPL-2.0, Unicode-3.0, Unlicense, Zlib
          # rust-cache runs only as CI tooling and is never linked into or distributed with Pasted.
          allow-dependencies-licenses: pkg:githubactions/Swatinem/rust-cache
          comment-summary-in-pr: on-failure

  dependency-policy:
    name: Verify Rust dependency policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --all-features
          command: check
          command-arguments: advisories bans licenses sources --hide-inclusion-graph

  validation-scope:
    name: Detect validation scope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect native-impacting changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          native=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            native=false
            while IFS= read -r path; do
              case "$path" in
                src-tauri/*|.cargo/*|rust-toolchain*|deny.toml|package.json|package-lock.json|.github/workflows/desktop-builds.yml)
                  native=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"

  validate-frontend:
    name: Validate frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:frontend

  validate-native:
    name: Validate native
    if: >-
      github.event_name != 'pull_request' &&
      needs.validation-scope.outputs.native == 'true'
    needs: [validation-scope]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          shared-key: native-debug1-linux
      - name: Install Linux test dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            tesseract-ocr
      - run: npm run test:native

  validate:
    name: Validate
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [validation-scope, validate-frontend, validate-native, smoke-macos, smoke-linux, smoke-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm validation results
        env:
          SCOPE_RESULT: ${{ needs.validation-scope.result }}
          FRONTEND_RESULT: ${{ needs.validate-frontend.result }}
          NATIVE_REQUIRED: ${{ needs.validation-scope.outputs.native }}
          NATIVE_RESULT: ${{ needs.validate-native.result }}
          MACOS_RESULT: ${{ needs.smoke-macos.result }}
          LINUX_RESULT: ${{ needs.smoke-linux.result }}
          WINDOWS_RESULT: ${{ needs.smoke-windows.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$SCOPE_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          if test "$EVENT_NAME" = "pull_request" && test "$NATIVE_REQUIRED" = "true"; then
            test "$NATIVE_RESULT" = "skipped"
            test "$MACOS_RESULT" = "success"
            test "$LINUX_RESULT" = "success"
            test "$WINDOWS_RESULT" = "success"
          elif test "$EVENT_NAME" = "pull_request"; then
            test "$NATIVE_RESULT" = "skipped"
            test "$MACOS_RESULT" = "skipped"
            test "$LINUX_RESULT" = "skipped"
            test "$WINDOWS_RESULT" = "skipped"
          elif test "$NATIVE_REQUIRED" = "true"; then
            test "$NATIVE_RESULT" = "success"
            test "$MACOS_RESULT" = "skipped"
            test "$LINUX_RESULT" = "skipped"
            test "$WINDOWS_RESULT" = "skipped"
          else
            test "$NATIVE_RESULT" = "skipped"
            test "$MACOS_RESULT" = "skipped"
            test "$LINUX_RESULT" = "skipped"
            test "$WINDOWS_RESULT" = "skipped"
          fi

  smoke-macos:
    name: Smoke macOS native
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.validation-scope.outputs.native == 'true'
    needs: [validation-scope, dependency-review, dependency-policy]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          shared-key: native-debug1-macos
      - name: Compile native tests and binaries
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-run --locked
          cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features cli --bin pasted

  smoke-linux:
    name: Smoke Linux x86_64
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.validation-scope.outputs.native == 'true'
    needs: [validation-scope, dependency-review, dependency-policy]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          shared-key: native-debug1-linux
      - name: Install Linux build dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            tesseract-ocr
      - name: Run native validation
        run: npm run test:native

  smoke-windows:
    name: Smoke Windows x86_64
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.validation-scope.outputs.native == 'true'
    needs: [validation-scope, dependency-review, dependency-policy]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          shared-key: native-debug1-windows
      - name: Compile native tests and binaries
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-run --locked
          cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features cli --bin pasted

  package:
    name: Package ${{ matrix.name }}
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.validation-scope.result == 'success' &&
      needs.validate-frontend.result == 'success' &&
      needs.dependency-policy.result == 'success'
    # Package beside native validation instead of serializing two independent
    # six-to-twelve-minute phases. The workflow still fails if either path fails.
    needs: [validation-scope, validate-frontend, dependency-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
            artifact: Pasted-Linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            platform: windows
            artifact: Pasted-Windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # These artifacts prove packaging and are retained only for CI inspection.
      # Keep release-mode cfg behavior without paying the production release's
      # fat-LTO, single-codegen-unit link cost. desktop-release.yml intentionally
      # retains the production profile for shipped binaries.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Build headless CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --no-default-features --features cli --bin pasted
      - name: Stage CLI for desktop bundle
        run: npm run stage:cli-sidecar
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles appimage --config src-tauri/tauri.cli-sidecar.conf.json
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.cli-sidecar.conf.json
      - name: Extract packaged payload for SBOM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scan_root="$RUNNER_TEMP/pasted-artifact-scan"
          rm -rf "$scan_root"
          mkdir -p "$scan_root"
          appimage="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f -print -quit)"
          chmod +x "$appimage"
          (
            cd "$scan_root"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          cp src-tauri/target/release/pasted "$scan_root/pasted-linux-x86_64"
          echo "ARTIFACT_SCAN_PATH=$scan_root" >> "$GITHUB_ENV"
          echo "ARTIFACT_SBOM_PATH=$RUNNER_TEMP/Pasted-${{ matrix.platform }}.artifact.spdx.json" >> "$GITHUB_ENV"
      - name: Extract packaged payload for SBOM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scanRoot = Join-Path $env:RUNNER_TEMP 'pasted-artifact-scan'
          New-Item -ItemType Directory -Force $scanRoot | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          & 7z x $installer.FullName "-o$scanRoot" -y | Out-Null
          Copy-Item src-tauri/target/release/pasted.exe "$scanRoot/pasted-windows-x86_64.exe"
          "ARTIFACT_SCAN_PATH=$scanRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_SBOM_PATH=$env:RUNNER_TEMP/Pasted-windows.artifact.spdx.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate exact-artifact SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ env.ARTIFACT_SCAN_PATH }}
          format: spdx-json
          output-file: ${{ env.ARTIFACT_SBOM_PATH }}
          artifact-name: Pasted-${{ matrix.platform }}-artifact.spdx.json
          upload-artifact: true
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Audit exact-artifact SBOM
        run: node scripts/audit-artifact-sbom.js "${{ env.ARTIFACT_SBOM_PATH }}" "${{ matrix.platform }}"
      - name: Stage Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage ci-artifacts/
          cp src-tauri/target/release/pasted ci-artifacts/pasted-linux-x86_64
          cd ci-artifacts
          sha256sum ./* > SHA256SUMS-linux-x86_64.txt
      - name: Stage Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe ci-artifacts/
          Copy-Item src-tauri/target/release/pasted.exe ci-artifacts/pasted-windows-x86_64.exe
          $checksumLines = Get-ChildItem ci-artifacts -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $checksumPath = Join-Path (Resolve-Path ci-artifacts) 'SHA256SUMS-windows-x86_64.txt'
          [IO.File]::WriteAllText($checksumPath, (($checksumLines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ci-artifacts/*
          if-no-files-found: error

  package-macos:
    name: Package macOS universal CLI and DMG
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.validation-scope.result == 'success' &&
      needs.validate-frontend.result == 'success' &&
      needs.dependency-policy.result == 'success'
    # Keep release compilation parallel with native validation. This job only
    # uploads ephemeral CI artifacts; the workflow remains red on any failure.
    needs: [validation-scope, validate-frontend, dependency-policy]
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: '-'
      # Match the other ephemeral CI packages while leaving signed releases on
      # the production Cargo profile.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      # Exercise the branded Finder presentation in CI instead of Tauri's
      # default plain-folder fallback.
      TAURI_BUNDLER_DMG_IGNORE_CI: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          shared-key: macos-universal-package
      - run: npm ci
      - name: Build and sign macOS universal CLI
        run: |
          bash scripts/build-macos-universal-cli.sh
          codesign \
            --force \
            --sign - \
            src-tauri/target/universal-apple-darwin/release/pasted
          codesign \
            --verify \
            --strict \
            --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/pasted
          npm run stage:cli-sidecar:macos-universal
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Pasted-macOS-universal-CLI
          path: src-tauri/target/universal-apple-darwin/release/pasted
          if-no-files-found: error
          retention-days: 1
      - name: Verify staged macOS universal CLI
        run: |
          lipo \
            src-tauri/target/universal-apple-darwin/release/pasted \
            -verify_arch arm64 x86_64
          codesign \
            --verify \
            --strict \
            --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/pasted
      - name: Build unnotarized macOS test DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.cli-sidecar.conf.json
      - name: Verify macOS test package
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Pasted_*.dmg' -type f -print -quit)"
          bash scripts/verify-macos-release.sh "$dmg_path" --local
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Pasted-macOS-universal-DMG
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Pasted_*.dmg
          if-no-files-found: error
          retention-days: 1

  package-macos-artifact:
    name: Audit macOS packaged artifact
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.package-macos.result == 'success'
    needs: [package-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Pasted-macOS-universal-CLI
          path: ci-artifacts/cli
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Pasted-macOS-universal-DMG
          path: ci-artifacts/dmg
      - name: Extract packaged payload for SBOM
        run: |
          scan_root="$RUNNER_TEMP/pasted-artifact-scan"
          dmg_path="$(find ci-artifacts/dmg -name 'Pasted_*.dmg' -type f -print -quit)"
          cli_path="$(find ci-artifacts/cli -name pasted -type f -print -quit)"
          mount_path="$scan_root/mount"
          mkdir -p "$mount_path"
          device="$(hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path" | awk '/^\/dev\// { print $1; exit }')"
          ditto "$mount_path/Pasted.app" "$scan_root/Pasted.app"
          hdiutil detach "$device"
          cp "$cli_path" "$scan_root/pasted-macos-universal"
          echo "ARTIFACT_SCAN_PATH=$scan_root" >> "$GITHUB_ENV"
          echo "ARTIFACT_SBOM_PATH=$RUNNER_TEMP/Pasted-macos.artifact.spdx.json" >> "$GITHUB_ENV"
      - name: Generate exact-artifact SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ env.ARTIFACT_SCAN_PATH }}
          format: spdx-json
          output-file: ${{ env.ARTIFACT_SBOM_PATH }}
          artifact-name: Pasted-macos-artifact.spdx.json
          upload-artifact: true
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Audit exact-artifact SBOM
        run: node scripts/audit-artifact-sbom.js "$ARTIFACT_SBOM_PATH" macos
