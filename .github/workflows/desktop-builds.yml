name: Desktop builds

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run test:all

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: Pasted-Linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: Pasted-Windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Build and sign macOS universal CLI
        if: runner.os == 'macOS'
        run: |
          bash scripts/build-macos-universal-cli.sh
          codesign \
            --force \
            --sign - \
            src-tauri/target/universal-apple-darwin/release/pasted
          codesign \
            --verify \
            --strict \
            --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/pasted
      - name: Build unnotarized macOS test DMG
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles appimage
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Verify macOS test package
        if: runner.os == 'macOS'
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Pasted_*.dmg' -type f -print -quit)"
          bash scripts/verify-macos-release.sh "$dmg_path" --local
      - name: Stage Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage ci-artifacts/
          cp src-tauri/target/release/pasted ci-artifacts/pasted-linux-x86_64
          cd ci-artifacts
          sha256sum ./* > SHA256SUMS-linux-x86_64.txt
      - name: Stage Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe ci-artifacts/
          Copy-Item src-tauri/target/release/pasted.exe ci-artifacts/pasted-windows-x86_64.exe
          $checksumLines = Get-ChildItem ci-artifacts -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $checksumPath = Join-Path (Resolve-Path ci-artifacts) 'SHA256SUMS-windows-x86_64.txt'
          [IO.File]::WriteAllText($checksumPath, (($checksumLines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: ${{ matrix.artifact }}
          path: ci-artifacts/*
          if-no-files-found: error
