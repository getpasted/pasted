[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "Build-time-only through the GTK3 macros required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0411", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0412", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0413", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0414", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0415", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0416", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0417", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0418", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0419", reason = "Build-time-only GTK3 macro required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0420", reason = "Unmaintained GTK3 binding required by Tauri's Linux stack; no safe upgrade is available." },
    { id = "RUSTSEC-2024-0429", reason = "Linux GTK/Tauri transitively requires glib 0.18; Pasted does not use VariantStrIter, and issue #15 tracks the upstream migration." },
    { id = "RUSTSEC-2025-0075", reason = "Unmaintained Unicode crate transitive through Tauri's URL-pattern parser; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0080", reason = "Unmaintained Unicode crate transitive through Tauri's URL-pattern parser; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0081", reason = "Unmaintained Unicode crate transitive through Tauri's URL-pattern parser; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0098", reason = "Unmaintained Unicode crate transitive through Tauri's URL-pattern parser; no safe upgrade is available." },
    { id = "RUSTSEC-2025-0100", reason = "Unmaintained Unicode crate transitive through Tauri's URL-pattern parser; no safe upgrade is available." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
