<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app_icon.png" />
    <title>Pasted</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('pasted_cache_theme');
          if (savedTheme) document.documentElement.dataset.startupTheme = savedTheme;
        } catch {}
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --startup-bg: #171717;
        --startup-text: rgba(255, 255, 255, 0.94);
        --startup-copycat: #65e6b4;
        --startup-copycat-inner: #a7ffd6;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --startup-bg: #f4f4f7;
          --startup-text: rgba(18, 22, 30, 0.92);
          --startup-copycat: #138b64;
          --startup-copycat-inner: #2caf7f;
        }
      }

      html[data-startup-theme="dark"],
      html[data-startup-theme="vampire"],
      html[data-startup-theme="flux"],
      html[data-startup-theme="808"] {
        color-scheme: dark;
        --startup-bg: #171717;
        --startup-text: rgba(255, 255, 255, 0.94);
        --startup-copycat: #65e6b4;
        --startup-copycat-inner: #a7ffd6;
      }

      html[data-startup-theme="cool"],
      html[data-startup-theme="warm"],
      html[data-startup-theme="2894"],
      html[data-startup-theme="sauced"] {
        color-scheme: light;
        --startup-bg: #f4f4f7;
        --startup-text: rgba(18, 22, 30, 0.92);
        --startup-copycat: #138b64;
        --startup-copycat-inner: #2caf7f;
      }

      html[data-startup-theme="warm"] { --startup-bg: #f3eee5; }
      html[data-startup-theme="2894"] { --startup-bg: #edf2f3; }
      html[data-startup-theme="sauced"] { --startup-bg: #fff4fa; }
      html[data-startup-theme="vampire"] { --startup-bg: #19131f; }
      html[data-startup-theme="flux"] { --startup-bg: #07151d; }
      html[data-startup-theme="808"] { --startup-bg: #151515; }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: transparent;
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--startup-bg);
        color: var(--startup-text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        opacity: 1;
        will-change: opacity;
      }

      #startup-splash,
      #startup-splash * {
        box-sizing: border-box;
      }

      #startup-splash.is-ready {
        pointer-events: none;
      }

      #startup-splash.is-dismiss-ready .startup-copycat-outline,
      #startup-splash.is-dismiss-ready .startup-copycat-ear,
      #startup-splash.is-ready .startup-copycat-outline,
      #startup-splash.is-ready .startup-copycat-ear {
        animation-play-state: paused;
      }

      #startup-splash .startup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-0.5rem) scale(1);
      }

      #startup-splash .startup-lockup {
        position: relative;
        width: 8.5rem;
        height: 5.35rem;
        transform: scale(1.35);
        transform-origin: center;
      }

      #startup-splash .startup-copycat-mask {
        position: absolute;
        inset: 0 0 1.5625rem;
        overflow: hidden;
      }

      #startup-splash .startup-copycat {
        position: absolute;
        inset: 0 0 -1.5625rem;
        overflow: visible;
        transform: translateX(12px) rotate(-24deg);
        transform-origin: 50% 70%;
      }

      #startup-splash .startup-copycat svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #startup-splash .startup-copycat-outline {
        fill: none;
        stroke: var(--startup-copycat);
        stroke-width: 14px;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: -1;
        animation: startup-copycat-draw 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      #startup-splash .startup-copycat-ear {
        fill: var(--startup-copycat-inner);
        opacity: 0;
        animation: startup-copycat-ear-fill 3.6s ease-in-out infinite;
      }

      #startup-splash .startup-name {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: 0.38rem;
        padding: 0.08rem 0.48rem 0.12rem;
        background: var(--startup-bg);
        font-size: 1.05rem;
        font-weight: 680;
        line-height: 1.15;
        letter-spacing: -0.025em;
        transform: translateX(-50%);
      }

      @keyframes startup-copycat-draw {
        0%, 10% { stroke-dashoffset: -1; opacity: 0; }
        18% { opacity: 0.45; }
        58%, 78% { stroke-dashoffset: 0; opacity: 1; }
        94%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }

      @keyframes startup-copycat-ear-fill {
        0%, 52%, 100% { opacity: 0; }
        64%, 78% { opacity: 0.92; }
        92% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-splash,
        #startup-splash .startup-content { transition: none; }
        #startup-splash .startup-copycat-outline {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
        #startup-splash .startup-copycat-ear {
          animation: none;
          opacity: 0.92;
        }
      }
    </style>
  </head>

  <body>
    <div id="startup-splash" data-tauri-drag-region aria-live="polite" aria-label="Pasted is starting">
      <div class="startup-content" data-tauri-drag-region>
        <div class="startup-lockup" data-tauri-drag-region>
          <div class="startup-copycat-mask" data-tauri-drag-region aria-hidden="true">
            <div class="startup-copycat" data-tauri-drag-region>
              <!-- Exact Head/Ear paths from Pasted-Website/public/copycat/copycat.svg. -->
              <svg viewBox="200 0 390 330" data-tauri-drag-region>
                <g transform="matrix(1,0,0,1,-341.923,-160.282)" data-tauri-drag-region>
                  <path class="startup-copycat-outline" pathLength="1" d="M762.025,620.149C792.044,608.035 843.614,576.749 851.237,451.875C894.917,385.847 905.932,326.914 905.525,294.084C905.384,269.438 829.823,286.574 786.666,321.664C771.878,304.128 721.228,275.201 676.949,275.591C668.951,234.12 653.991,172.808 628.925,167.302C596.322,165.665 547.394,263.912 544.258,306.23C487.41,359.697 383.39,506.226 577.086,579.023" />
                  <path class="startup-copycat-ear" d="M568.875,301.546C568.519,284.235 606.629,194.829 624.529,197.231C637.313,198.946 648.148,275.414 648.148,275.414C648.148,275.414 610.988,280.491 568.875,301.546Z" />
                  <g transform="matrix(-0.897657,-0.937758,-0.849026,0.81272,1610.05,720.378)" data-tauri-drag-region>
                    <path class="startup-copycat-ear" d="M574.828,299.41C579.864,275.433 595.27,222.372 619.789,207.431C629.713,207.255 642.219,275.66 642.219,275.66C642.219,275.66 616.941,278.355 574.828,299.41Z" />
                  </g>
                </g>
              </svg>
            </div>
          </div>
          <div class="startup-name" data-tauri-drag-region>Pasted</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
